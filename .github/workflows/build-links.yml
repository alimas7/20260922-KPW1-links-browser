name: Build Kindle KPW1 Links Browser (static musl + TLS 1.2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-links:
    name: Build static ARMv7 soft-float Links for KPW1
    runs-on: ubuntu-22.04

    env:
      OPENSSL_VERSION: 1.1.1w
      LINKS_VERSION: "2.30"

      # KPW1 target ABI: 32-bit ARM Linux, soft-float EABI.
      TARGET: arm-linux-musleabi

      PREFIX: ${{ github.workspace }}/stage
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain

      # KPW1 is ARMv7-class and uses soft-float userspace.
      ARCH_FLAGS: -march=armv7-a -mtune=cortex-a8 -mfloat-abi=softfp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            make \
            perl \
            pkg-config \
            python3 \
            tar \
            unzip \
            xz-utils \
            zip

      - name: Download x86_64-hosted ARM soft-float musl toolchain
        shell: bash
        run: |
          set -euxo pipefail

          # Host: GitHub ubuntu-22.04 runner (x86_64)
          # Target: Kindle KPW1 (arm-linux-musleabi)
          TOOLCHAIN_URL="https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/x86_64-arm-linux-musleabi.tar.xz"

          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            --output arm-linux-musleabi-toolchain.tar.xz \
            "$TOOLCHAIN_URL"

          mkdir -p "$TOOLCHAIN_DIR"
          tar -xJf arm-linux-musleabi-toolchain.tar.xz -C "$TOOLCHAIN_DIR"

          CC_PATH="$(
            find "$TOOLCHAIN_DIR" -type f \
              -path '*/bin/arm-linux-musleabi-gcc' \
              -print -quit
          )"

          test -n "$CC_PATH"
          test -x "$CC_PATH"

          TOOLCHAIN_BIN="$(dirname "$CC_PATH")"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - name: Verify musl cross-toolchain
        shell: bash
        run: |
          set -euxo pipefail

          command -v arm-linux-musleabi-gcc
          arm-linux-musleabi-gcc --version

          test "$(arm-linux-musleabi-gcc -dumpmachine)" = "arm-linux-musleabi"

          cat > hello.c <<'EOF'
          #include <stdio.h>

          int main(void) {
              puts("KPW1 static musl test");
              return 0;
          }
          EOF

          arm-linux-musleabi-gcc \
            -march=armv7-a \
            -mtune=cortex-a8 \
            -mfloat-abi=softfp \
            -static \
            -Os \
            hello.c \
            -o hello-arm-musl

          file hello-arm-musl

          arm-linux-musleabi-readelf -h hello-arm-musl | \
            grep -E 'Class:|Machine:'

          if arm-linux-musleabi-readelf -l hello-arm-musl | \
            grep -q 'Requesting program interpreter'; then
            echo "ERROR: test binary is dynamically linked."
            exit 1
          fi

      - name: Download and build static OpenSSL 1.1.1w
        shell: bash
        run: |
          set -euxo pipefail

          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            --output "openssl-${OPENSSL_VERSION}.tar.gz" \
            "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"

          tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"

          # Do not set CROSS_COMPILE: OpenSSL's linux-armv4 config internally
          # prepends it to CC, producing a doubled tool prefix otherwise.
          unset CROSS_COMPILE

          export CC="${TARGET}-gcc"
          export AR="${TARGET}-ar"
          export RANLIB="${TARGET}-ranlib"
          export NM="${TARGET}-nm"
          export STRIP="${TARGET}-strip"

          export CFLAGS="-Os -fdata-sections -ffunction-sections ${ARCH_FLAGS}"
          export LDFLAGS="-static -Wl,--gc-sections"

          ./Configure linux-armv4 \
            no-shared \
            no-tests \
            no-async \
            no-engine \
            no-dso \
            --prefix="$PREFIX" \
            --openssldir="$PREFIX/ssl"

          make -j"$(nproc)"
          make install_sw

          test -f "$PREFIX/lib/libssl.a"
          test -f "$PREFIX/lib/libcrypto.a"
          test -f "$PREFIX/include/openssl/ssl.h"

      - name: Download Links 2.30 source
        shell: bash
        run: |
          set -euxo pipefail

          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            --output "links-${LINKS_VERSION}.tar.gz" \
            "http://links.twibright.com/download/links-${LINKS_VERSION}.tar.gz"

          tar -xzf "links-${LINKS_VERSION}.tar.gz"
          mv "links-${LINKS_VERSION}" links-src

      - name: Configure and build static text-mode Links
        shell: bash
        run: |
          set -euxo pipefail

          cd links-src

          export CC="${TARGET}-gcc"
          export AR="${TARGET}-ar"
          export RANLIB="${TARGET}-ranlib"
          export STRIP="${TARGET}-strip"

          # Prevent host x86_64 packages from contaminating the cross-build.
          export PKG_CONFIG_DIR=""
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

          export CPPFLAGS="-I$PREFIX/include"
          export CFLAGS="-Os -fdata-sections -ffunction-sections $ARCH_FLAGS"
          export LDFLAGS="-static -Wl,--gc-sections -L$PREFIX/lib"
          export LIBS="-lssl -lcrypto -lpthread -ldl"

          # Text-only Links: no graphics/libpng/X11/framebuffer/SDL.
          ./configure \
            --build="$(gcc -dumpmachine)" \
            --host="$TARGET" \
            --without-x \
            --without-sdl \
            --disable-javascript \
            --with-ssl

          make -j"$(nproc)"
          "$STRIP" links

      - name: Verify Links binary
        shell: bash
        run: |
          set -euxo pipefail

          BIN="links-src/links"

          test -f "$BIN"
          file "$BIN"

          "${TARGET}-readelf" -h "$BIN" | \
            grep -E 'Class:|Machine:'

          if "${TARGET}-readelf" -l "$BIN" | \
            grep -q 'Requesting program interpreter'; then
            echo "ERROR: links is dynamically linked."
            exit 1
          fi

          ls -lh "$BIN"

      - name: Download current CA certificate bundle
        shell: bash
        run: |
          set -euxo pipefail

          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            --output cacert.pem \
            https://curl.se/ca/cacert.pem

          test -s cacert.pem
          grep -q -- 'BEGIN CERTIFICATE' cacert.pem

      - name: Package KUAL extension
        shell: bash
        run: |
          set -euxo pipefail

          EXT="dist/extensions/links_browser"

          mkdir -p "$EXT/bin"

          cp links-src/links "$EXT/bin/links"
          cp cacert.pem "$EXT/cacert.pem"

          test -f extensions/links_browser/config.xml
          test -f extensions/links_browser/menu.json
          test -f extensions/links_browser/bin/run.sh

          cp extensions/links_browser/config.xml "$EXT/config.xml"
          cp extensions/links_browser/menu.json "$EXT/menu.json"
          cp extensions/links_browser/bin/run.sh "$EXT/bin/run.sh"

          python3 -m json.tool "$EXT/menu.json" >/dev/null

          chmod 755 "$EXT/bin/links" "$EXT/bin/run.sh"

          echo "Packaged extension files:"
          find dist -type f -printf '%p  %s bytes\n'

      - name: Create installable Kindle ZIP
        shell: bash
        run: |
          set -euxo pipefail

          test -f dist/extensions/links_browser/config.xml
          test -f dist/extensions/links_browser/menu.json
          test -f dist/extensions/links_browser/cacert.pem
          test -f dist/extensions/links_browser/bin/links
          test -f dist/extensions/links_browser/bin/run.sh

          cd dist
          zip -r ../kindle-links-kpw1.zip extensions

          cd ..
          ls -lh kindle-links-kpw1.zip
          unzip -l kindle-links-kpw1.zip

      - name: Upload KPW1 Links artifact
        uses: actions/upload-artifact@v4
        with:
          name: kindle-links-kpw1
          path: |
            dist/extensions/
            kindle-links-kpw1.zip
          if-no-files-found: error
          retention-days: 14