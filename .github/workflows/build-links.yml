name: Build Kindle KPW1 Links Browser (static musl + TLS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-links:
    name: Build ARMv7 soft-float Links for KPW1
    runs-on: ubuntu-22.04

    env:
      # Sources
      OPENSSL_VERSION: 1.1.1w
      LINKS_VERSION: "2.30"

      # Build locations
      PREFIX: ${{ github.workspace }}/stage
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain

      # KPW1: 32-bit ARM, soft-float EABI.
      TARGET: arm-linux-musleabi
      ARCH_FLAGS: -march=armv7-a -mtune=cortex-a8 -mfloat-abi=softfp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            make \
            perl \
            pkg-config \
            tar \
            xz-utils

      - name: Download ARM musl cross-toolchain
        shell: bash
        run: |
          set -euxo pipefail

          # musl.cc toolchains are static cross toolchains.
          # The target is ARM EABI soft-float, NOT musleabihf.
          curl --fail --location --retry 3 \
            --output arm-linux-musleabi-cross.tgz \
            https://musl.cc/arm-linux-musleabi-cross.tgz

          mkdir -p "$TOOLCHAIN_DIR"
          tar -xzf arm-linux-musleabi-cross.tgz -C "$TOOLCHAIN_DIR"

          # The archive normally expands to:
          # toolchain/arm-linux-musleabi-cross/
          test -x "$TOOLCHAIN_DIR/arm-linux-musleabi-cross/bin/arm-linux-musleabi-gcc"

          echo "$TOOLCHAIN_DIR/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Verify cross-toolchain
        shell: bash
        run: |
          set -euxo pipefail

          arm-linux-musleabi-gcc --version
          arm-linux-musleabi-gcc -dumpmachine

          test "$(arm-linux-musleabi-gcc -dumpmachine)" = "arm-linux-musleabi"

          cat > hello.c <<'EOF'
          #include <stdio.h>
          int main(void) {
              puts("KPW1 musl test");
              return 0;
          }
          EOF

          arm-linux-musleabi-gcc \
            $ARCH_FLAGS \
            -static \
            -Os \
            -s \
            hello.c \
            -o hello-arm-musl

          file hello-arm-musl

          # It must be statically linked and ARM ELF.
          ! readelf -l hello-arm-musl | grep -q 'Requesting program interpreter'
          readelf -h hello-arm-musl | grep -E 'Class:|Machine:'

      - name: Download and build static OpenSSL
        shell: bash
        run: |
          set -euxo pipefail

          curl --fail --location --retry 3 \
            --output "openssl-${OPENSSL_VERSION}.tar.gz" \
            "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"

          tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"

          export CROSS_COMPILE="${TARGET}-"
          export CC="${TARGET}-gcc"
          export AR="${TARGET}-ar"
          export RANLIB="${TARGET}-ranlib"
          export NM="${TARGET}-nm"
          export STRIP="${TARGET}-strip"

          export CFLAGS="-Os -fdata-sections -ffunction-sections ${ARCH_FLAGS}"
          export LDFLAGS="-static -Wl,--gc-sections"

          # linux-armv4 is OpenSSL's ARM Linux target.
          # no-shared ensures libssl.a and libcrypto.a are built.
          # no-tests avoids attempting to execute ARM test binaries on x86_64 CI.
          ./Configure linux-armv4 \
            no-shared \
            no-tests \
            no-async \
            no-engine \
            no-dso \
            --prefix="$PREFIX" \
            --openssldir="$PREFIX/ssl"

          make -j"$(nproc)"
          make install_sw

          test -f "$PREFIX/lib/libssl.a"
          test -f "$PREFIX/lib/libcrypto.a"
          test -f "$PREFIX/include/openssl/ssl.h"

      - name: Download Links source
        shell: bash
        run: |
          set -euxo pipefail

          curl --fail --location --retry 3 \
            --output "links-${LINKS_VERSION}.tar.gz" \
            "http://links.twibright.com/download/links-${LINKS_VERSION}.tar.gz"

          tar -xzf "links-${LINKS_VERSION}.tar.gz"
          mv "links-${LINKS_VERSION}" links-src

      - name: Configure and build static text-mode Links
        shell: bash
        run: |
          set -euxo pipefail
          cd links-src

          export CC="${TARGET}-gcc"
          export AR="${TARGET}-ar"
          export RANLIB="${TARGET}-ranlib"
          export STRIP="${TARGET}-strip"
          export PKG_CONFIG=/usr/bin/pkg-config

          # Avoid host .pc metadata leaking into the cross-build.
          export PKG_CONFIG_DIR=""
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

          # OpenSSL headers and static libraries built in the prior step.
          export CPPFLAGS="-I$PREFIX/include"
          export CFLAGS="-Os -fdata-sections -ffunction-sections $ARCH_FLAGS"
          export LDFLAGS="-static -Wl,--gc-sections -L$PREFIX/lib"

          # Explicitly provide static OpenSSL libraries. The order matters:
          # ssl uses crypto, so ssl precedes crypto.
          export LIBS="-lssl -lcrypto -lpthread -ldl"

          # Text mode only: no libpng, no framebuffer/X/SDL requirements.
          # --build is the GitHub runner; --host is the Kindle target.
          ./configure \
            --build="$(gcc -dumpmachine)" \
            --host="$TARGET" \
            --without-x \
            --without-sdl \
            --disable-javascript \
            --with-ssl

          make -j"$(nproc)"

          # Do not run `make check`: it would try to run ARM code on x86_64.
          "$STRIP" links

      - name: Verify produced Links executable
        shell: bash
        run: |
          set -euxo pipefail

          BIN="links-src/links"

          test -f "$BIN"
          file "$BIN"
          "${TARGET}-readelf" -h "$BIN" | grep -E 'Class:|Machine:'
          "${TARGET}-readelf" -l "$BIN"

          # A static binary must have no ELF program interpreter.
          if "${TARGET}-readelf" -l "$BIN" | grep -q "Requesting program interpreter"; then
            echo "ERROR: links is dynamically linked; refusing to package it."
            exit 1
          fi

          # The dynamic section should normally be absent in a static binary.
          # `readelf -d` exits non-zero for a binary with no dynamic section,
          # hence `|| true`.
          "${TARGET}-readelf" -d "$BIN" 2>/dev/null || true

          # Display output size as a CI diagnostic.
          ls -lh "$BIN"

      - name: Create KUAL extension bundle
        shell: bash
        run: |
          set -euxo pipefail

          EXT="dist/extensions/links_browser"

          mkdir -p "$EXT/bin"
          cp links-src/links "$EXT/bin/links"

          # These files must exist in your repository.
          test -f extensions/links_browser/config.xml
          test -f extensions/links_browser/menu.json
          test -f extensions/links_browser/bin/run.sh

          cp extensions/links_browser/config.xml "$EXT/config.xml"
          cp extensions/links_browser/menu.json "$EXT/menu.json"
          cp extensions/links_browser/bin/run.sh "$EXT/bin/run.sh"

          # Validate JSON before publishing.
          python3 -m json.tool "$EXT/menu.json" >/dev/null

          # Permissions are meaningful inside the artifact/Linux build tree.
          # FAT /mnt/us on the Kindle does not preserve per-file Unix modes.
          chmod 755 "$EXT/bin/links" "$EXT/bin/run.sh"

          echo "Packaged files:"
          find dist -type f -printf '%p  %s bytes\n'

      - name: Archive KUAL extension
        shell: bash
        run: |
          set -euxo pipefail

          # Zip only the `extensions` directory, preserving the expected
          # top-level layout when the user extracts at the Kindle USB root.
          cd dist
          zip -r ../kindle-links-kpw1.zip extensions

      - name: Upload KUAL extension folder
        uses: actions/upload-artifact@v4
        with:
          name: kindle-links-kpw1-extension
          path: dist/extensions/
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kindle-links-kpw1-zip
          path: kindle-links-kpw1.zip
          if-no-files-found: error
          retention-days: 14