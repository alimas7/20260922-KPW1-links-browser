name: Build Kindle TLS1.2+ Links Browser

on:
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-links-tls:
    name: Cross-Compile Links Browser with Static TLS 1.2+
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install ARM Cross-Compiler Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabi make curl tar pkg-config

    - name: Download and Statically Build Modern OpenSSL
      run: |
        curl -sL https://www.openssl.org/source/openssl-1.1.1w.tar.gz | tar xfz -
        cd openssl-1.1.1w
        export CC=arm-linux-gnueabi-gcc
        ./Configure linux-armv4 -march=armv7-a -mtune=cortex-a8 -mfloat-abi=softfp no-shared no-tests --prefix=$GITHUB_WORKSPACE/openssl-static
        make -j$(nproc)
        make install_sw

    - name: Fetch Official Links Source Code
      run: |
        curl -sL http://links.twibright.com/download/links-2.30.tar.gz | tar xfz -
        mv links-2.30 links-src

    - name: Configure and Statically Link Browser Engine
      run: |
        cd links-src
        export CC=arm-linux-gnueabi-gcc
        export STRIP=arm-linux-gnueabi-strip
        export CFLAGS="-O3 -march=armv7-a -mtune=cortex-a8 -mfloat-abi=softfp -I$GITHUB_WORKSPACE/openssl-static/include"
        export LDFLAGS="-L$GITHUB_WORKSPACE/openssl-static/lib -static"
        export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/openssl-static/lib/pkgconfig"
        
        ./configure \
          --host=arm-linux-gnueabi \
          --enable-graphics \
          --with-fb \
          --without-x \
          --disable-javascript \
          --with-ssl
          
        make -j$(nproc)
        $STRIP links

    - name: Package KUAL Extension Bundle
      run: |
        mkdir -p dist/extensions/links_browser/bin
        cp links-src/links dist/extensions/links_browser/bin/links
        
        if [ -f extensions/links_browser/menu.json ]; then
          cp extensions/links_browser/menu.json dist/extensions/links_browser/menu.json
        else
          echo '{"items":[{"name":"Text Web Browser (Links)","priority":5,"action":"bin/run.sh","type":"cmd"}]}' > dist/extensions/links_browser/menu.json
        fi
        
        if [ -f extensions/links_browser/bin/run.sh ]; then
          cp extensions/links_browser/bin/run.sh dist/extensions/links_browser/bin/run.sh
        fi

        chmod +x dist/extensions/links_browser/bin/links
        chmod +x dist/extensions/links_browser/bin/run.sh

    - name: Upload Secure Links Browser Archive
      uses: actions/upload-artifact@v4
      with:
        name: kindle-secure-links-extension
        path: dist/extensions/
        if-no-files-found: error
        retention-days: 14
