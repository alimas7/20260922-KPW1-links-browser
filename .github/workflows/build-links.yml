name: Build Kindle KPW1 Links Browser (static musl + TLS 1.2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-links:
    name: Build static ARMv7 soft-float Links for KPW1
    runs-on: ubuntu-22.04

    env:
      OPENSSL_VERSION: 1.1.1w
      LINKS_VERSION: "2.30"

      TARGET: arm-linux-musleabi
      PREFIX: ${{ github.workspace }}/stage
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain

      # KPW1: ARMv7-class CPU and soft-float EABI.
      ARCH_FLAGS: -march=armv7-a -mtune=cortex-a8 -mfloat-abi=softfp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            make \
            perl \
            pkg-config \
            python3 \
            tar \
            unzip \
            xz-utils \
            zip

      - name: Download ARM soft-float musl cross-toolchain
        shell: bash
        run: |
          set -euxo pipefail

          # The release assets include the host prefix. GitHub's Linux runners
          # are x86_64, but this toolchain release calls the portable host asset
          # aarch64-arm-linux-musleabi.tar.xz.
          TOOLCHAIN_URL="https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/x86_64-arm-linux-musleabi.tar.xz"

          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            --output arm-linux-musleabi-toolchain.tar.xz \
            "$TOOLCHAIN_URL"

          mkdir -p "$TOOLCHAIN_DIR"
          tar -xJf arm-linux-musleabi-toolchain.tar.xz -C "$TOOLCHAIN_DIR"

          echo "Toolchain contents:"
          find "$TOOLCHAIN_DIR" -maxdepth 4 -type f -name '*-gcc' -print

          CC_PATH="$(
            find "$TOOLCHAIN_DIR" -type f \
              -path '*/bin/arm-linux-musleabi-gcc' \
              -print -quit
          )"

          test -n "$CC_PATH"
          test -x "$CC_PATH"

          TOOLCHAIN_BIN="$(dirname "$CC_PATH")"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - name: Verify musl cross-toolchain
        shell: bash
        run: |
          set -euxo pipefail

          command -v arm-linux-musleabi-gcc
          arm-linux-musleabi-gcc --version

          test "$(arm-linux-musleabi-gcc -dumpmachine)" = "arm-linux-musleabi"

          cat > hello.c <<'EOF'
          #include <stdio.h>

          int main(void) {
              puts("KPW1 static musl test");
              return 0;
          }
          EOF

          arm-linux-musleabi-gcc \
            -march=armv7-a \
            -mtune=cortex-a8 \
            -mfloat-abi=softfp \
            -static \
            -Os \
            hello.c \
            -o hello-arm-musl

          file hello-arm-musl

          arm-linux-musleabi-readelf -h hello-arm-musl | \
            grep -E 'Class:|Machine:'

          if arm-linux-musleabi-readelf -l hello-arm-musl | \
            grep -q 'Requesting program interpreter'; then
            echo "ERROR: hello-arm-musl is dynamically linked."
            exit 1
          fi

      - name: Download and build static OpenSSL
        shell: bash
        run: |
          set -euxo pipefail

          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            --output "openssl-${OPENSSL_VERSION}.tar.gz" \
            "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"

          tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"

          export CROSS_COMPILE="${TARGET}-"
          export CC="${TARGET}-gcc"
          export AR="${TARGET}-ar"
          export RANLIB="${TARGET}-ranlib"
          export NM="${TARGET}-nm"
          export STRIP="${TARGET}-strip"

          export CFLAGS="-Os -fdata-sections -ffunction-sections ${ARCH_FLAGS}"
          export LDFLAGS="-static -Wl,--gc-sections"

          ./Configure linux-armv4 \
            no-shared \
            no-tests \
            no-async \
            no-engine \
